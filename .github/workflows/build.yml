name: Build the apps

# Runs when a release is published. Each job builds on the system it is for,
# because PyInstaller cannot build a Mac app on Windows or the reverse, then
# attaches the result to that release.
on:
  release:
    types: [published]
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write             # needed to attach files to the release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install what the build needs
        run: python -m pip install --upgrade pyinstaller mammoth beautifulsoup4

      - name: Read the version out of core.py
        id: version
        shell: bash
        run: echo "value=$(grep '^VERSION = ' core.py | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: >
          python -m PyInstaller --onefile --windowed --clean --noconfirm
          --name "CBM Article Converter ${{ steps.version.outputs.value }}"
          --collect-all mammoth
          --add-data "USER-GUIDE.txt;."
          --add-data "HTML-REFERENCE.txt;."
          --add-data "BUILD-NOTES.txt;."
          app.py

      - name: Attach it to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "dist/CBM Article Converter ${{ steps.version.outputs.value }}.exe" --clobber

      - name: Keep it even when run by hand
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install what the build needs
        run: python -m pip install --upgrade pyinstaller mammoth beautifulsoup4

      - name: Read the version out of core.py
        id: version
        run: echo "value=$(grep '^VERSION = ' core.py | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: >
          python -m PyInstaller --onefile --windowed --clean --noconfirm
          --name "CBM Article Converter ${{ steps.version.outputs.value }}"
          --collect-all mammoth
          --add-data "USER-GUIDE.txt:."
          --add-data "HTML-REFERENCE.txt:."
          --add-data "BUILD-NOTES.txt:."
          app.py

      - name: Zip the app
        # A .app is a folder, so it cannot be attached as it stands. ditto
        # keeps the bundle's structure and permissions intact.
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent \
            "CBM Article Converter ${{ steps.version.outputs.value }}.app" \
            "CBM-Article-Converter-${{ steps.version.outputs.value }}-mac.zip"

      - name: Attach it to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "dist/CBM-Article-Converter-${{ steps.version.outputs.value }}-mac.zip" --clobber

      - name: Keep it even when run by hand
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*-mac.zip
