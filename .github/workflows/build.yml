name: Build the apps

# Action versions must run on Node 24: Node 20 was removed from the runners
# in September 2026. checkout v5, setup-python v6 and upload-artifact v7 are
# the first majors built for it.
#
# Runs when a release is published. Each job builds on the system it is for,
# because PyInstaller cannot build a Mac app on Windows or the reverse, then
# attaches the result to that release.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the files are where the build expects them
        shell: bash
        run: |
          echo "Working in: $(pwd)"
          echo "--- what is here ---"
          ls -la
          missing=0
          for f in app.py core.py USER-GUIDE.txt HTML-REFERENCE.txt BUILD-NOTES.txt; do
            if [ ! -f "$f" ]; then echo "MISSING: $f"; missing=1; fi
          done
          if [ "$missing" = "1" ]; then
            echo
            echo "These files must sit at the TOP LEVEL of the repository,"
            echo "not inside a folder. The listing above shows what is there."
            exit 1
          fi
          echo "All present."

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install what the build needs
        run: python -m pip install --upgrade pyinstaller mammoth beautifulsoup4

      - name: Read the version out of core.py
        id: version
        shell: bash
        run: echo "value=$(grep '^VERSION = ' core.py | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: >
          python -m PyInstaller --onefile --windowed --clean --noconfirm
          --name "CBM Article Converter ${{ steps.version.outputs.value }}"
          --collect-all mammoth
          --add-data "USER-GUIDE.txt;."
          --add-data "HTML-REFERENCE.txt;."
          --add-data "BUILD-NOTES.txt;."
          app.py

      - name: Attach it to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "dist/CBM Article Converter ${{ steps.version.outputs.value }}.exe" --clobber

      - name: Keep it even when run by hand
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the files are where the build expects them
        shell: bash
        run: |
          echo "Working in: $(pwd)"
          echo "--- what is here ---"
          ls -la
          missing=0
          for f in app.py core.py USER-GUIDE.txt HTML-REFERENCE.txt BUILD-NOTES.txt; do
            if [ ! -f "$f" ]; then echo "MISSING: $f"; missing=1; fi
          done
          if [ "$missing" = "1" ]; then
            echo
            echo "These files must sit at the TOP LEVEL of the repository,"
            echo "not inside a folder. The listing above shows what is there."
            exit 1
          fi
          echo "All present."

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install what the build needs
        run: python -m pip install --upgrade pyinstaller mammoth beautifulsoup4

      - name: Read the version out of core.py
        id: version
        run: echo "value=$(grep '^VERSION = ' core.py | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: >
          python -m PyInstaller --onefile --windowed --clean --noconfirm
          --name "CBM Article Converter ${{ steps.version.outputs.value }}"
          --collect-all mammoth
          --argv-emulation
          --add-data "USER-GUIDE.txt:."
          --add-data "HTML-REFERENCE.txt:."
          --add-data "BUILD-NOTES.txt:."
          app.py

      - name: Zip the app
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent \
            "CBM Article Converter ${{ steps.version.outputs.value }}.app" \
            "CBM-Article-Converter-${{ steps.version.outputs.value }}-mac.zip"

      - name: Attach it to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "dist/CBM-Article-Converter-${{ steps.version.outputs.value }}-mac.zip" --clobber

      - name: Keep it even when run by hand
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*-mac.zip
